[project]
name = "study-pdf-desktop"
version = "0.1.0"
description = "Personal desktop study app for PDF reading and scheduled review"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "pypdf>=4.2.0"
]

[project.scripts]
study-app = "study_app.main:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["study_app*"]
exclude = ["third_party*", "tests*"]

[tool.setuptools.package-data]
study_app = [
  "ui/web/*.html",
  "ui/web/*.js",
  "ui/web/*.css",
  "ui/web/vendor/pdfjs/README.md",
  "ui/web/vendor/pdfjs/build/*.mjs",
  "ui/*.md",
]
